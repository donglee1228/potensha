<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>포텐샤 · POTENSHA</title>
<link rel="icon" href="favicon.ico" sizes="any" />
<style>
  :root{--gold:#d4af37;--gold2:#f0d986;--red:#b5313f;--ink:#e8eaed;--muted:#9aa3b0;--line:#2a313d}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;
    font-family:"Pretendard","Segoe UI","Apple SD Gothic Neo",system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(900px 500px at 82% -10%,rgba(212,175,55,.08),transparent 60%),
               radial-gradient(800px 460px at -5% 110%,rgba(181,49,63,.10),transparent 55%),#101317}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .lock{position:relative;z-index:1;width:min(360px,90vw);text-align:center;
    border:1px solid var(--line);border-radius:18px;padding:40px 30px;
    background:linear-gradient(135deg,#191e26,#14181e);box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .emblem{width:72px;height:72px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;
    font-weight:800;font-size:34px;color:#13161b;border:2px solid var(--gold);
    background:linear-gradient(135deg,var(--gold2),var(--gold))}
  h1{margin:0;font-size:22px;letter-spacing:.5px}
  h1 b{color:var(--gold)}
  .sub{color:var(--muted);font-size:13px;margin:6px 0 24px;letter-spacing:2px;text-transform:uppercase}
  input{width:100%;padding:13px 15px;border-radius:11px;border:1px solid var(--line);
    background:#0e1116;color:var(--ink);font-size:16px;text-align:center;letter-spacing:4px;outline:none}
  input:focus{border-color:var(--gold)}
  button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:11px;cursor:pointer;
    font-size:15px;font-weight:700;color:#13161b;background:linear-gradient(90deg,var(--gold),var(--gold2))}
  button:hover{filter:brightness(1.07)}
  .err{color:var(--red);font-size:13px;min-height:18px;margin-top:12px;font-weight:600}
  .hint{color:#6b7484;font-size:11px;margin-top:16px}
</style>
</head>
<body>
  <form class="lock" id="gate" autocomplete="off">
    <div class="emblem">P</div>
    <h1>포텐<b>샤</b></h1>
    <div class="sub">Private · Locked</div>
    <input id="pw" type="password" inputmode="numeric" placeholder="비밀번호" autofocus />
    <button type="submit">열기</button>
    <div class="err" id="err"></div>
    <div class="hint">🔒 AES-256 암호화 · 비밀번호가 있어야 내용이 복호화됩니다</div>
  </form>

const b64d = (s)=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64d(SALT), iterations:ITER, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(IV)}, key, b64d(CT));
  return new TextDecoder().decode(pt);
}
function render(html){ document.open(); document.write(html); document.close(); }
async function tryUnlock(pw, fromCache){
  try{
    const html = await decrypt(pw);
    sessionStorage.setItem('potensha_pw', pw);
    render(html);
  }catch(e){
    if(!fromCache){ document.getElementById('err').textContent='비밀번호가 올바르지 않아요';
      const i=document.getElementById('pw'); i.value=''; i.focus(); }
    else { sessionStorage.removeItem('potensha_pw'); }
  }
}
document.getElementById('gate').addEventListener('submit', (e)=>{
